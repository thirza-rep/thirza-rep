<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="M. Thirza Salendra - Full-Stack Software Engineer and System Architect">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="56" y1="158" x2="540" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="top-bar-accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) rotate(90) scale(210 340)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 280) rotate(90) scale(190 320)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.38" />
    </pattern>

    <clipPath id="card-clip">
      <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Base dark background -->
    <rect width="1200" height="300" fill="url(#bg-grad)" />
    <rect width="1200" height="300" fill="url(#dot-grid)" />

    <!-- Ambient soft lighting -->
    <rect width="1200" height="300" fill="url(#glow-cyan)" />
    <rect width="1200" height="300" fill="url(#glow-indigo)" />

    <!-- Top luminous hairline -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#top-bar-accent)" />

    <!-- Left Identity Column -->
    <!-- Status Pill -->
    <rect x="56" y="38" width="336" height="28" rx="14" fill="#111C33" stroke="#1E3A5F" stroke-width="1" />
    <circle cx="74" cy="52" r="4" fill="#10B981" />
    <circle cx="74" cy="52" r="7" fill="#10B981" fill-opacity="0.22" />
    <text x="89" y="56" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.1">YOGYAKARTA, ID  ·  OPEN TO COLLABORATE</text>

    <!-- Main Name -->
    <text x="56" y="120" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">M. Thirza Salendra</text>

    <!-- Role Title -->
    <text x="56" y="154" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" letter-spacing="-0.2">Full-Stack Software Engineer &amp; System Architect</text>

    <!-- Tagline -->
    <text x="56" y="191" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Architecting enterprise ERP/SaaS platforms, cross-platform apps,</text>
    <text x="56" y="213" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">and self-hosted infrastructure — Founder &amp; Author at Codevits.</text>

    <!-- Specialty Chips -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">
      <rect x="56" y="238" width="128" height="28" rx="7" fill="#0F1D36" stroke="#1E3A5F" stroke-width="1" />
      <text x="120" y="256" text-anchor="middle" fill="#7DD3FC">Enterprise ERP</text>

      <rect x="194" y="238" width="136" height="28" rx="7" fill="#131B36" stroke="#2E3268" stroke-width="1" />
      <text x="262" y="256" text-anchor="middle" fill="#A5B4FC">Cross-Platform</text>

      <rect x="340" y="238" width="142" height="28" rx="7" fill="#0E222E" stroke="#164E63" stroke-width="1" />
      <text x="411" y="256" text-anchor="middle" fill="#67E8F9">Self-Hosted Ops</text>

      <rect x="492" y="238" width="118" height="28" rx="7" fill="#141C2B" stroke="#334155" stroke-width="1" />
      <text x="551" y="256" text-anchor="middle" fill="#CBD5E1">codevits.site</text>
    </g>

    <!-- Right Terminal Glass Card -->
    <rect x="684" y="34" width="462" height="232" rx="12" fill="#0B1221" fill-opacity="0.92" stroke="#1E293B" stroke-width="1.2" />
    <!-- Terminal Header -->
    <path d="M684 46C684 39.3726 689.373 34 696 34H1134C1140.63 34 1146 39.3726 1146 46V66H684V46Z" fill="#111A2E" />
    <line x1="684" y1="66" x2="1146" y2="66" stroke="#1E293B" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="704" cy="50" r="4.5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="720" cy="50" r="4.5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="736" cy="50" r="4.5" fill="#10B981" fill-opacity="0.85" />

    <!-- File Label -->
    <text x="915" y="54" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">architect.config.ts</text>

    <!-- Code Content -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <text x="706" y="92">
        <tspan fill="#C084FC">const</tspan>
        <tspan fill="#E2E8F0"> engineer </tspan>
        <tspan fill="#38BDF8">=</tspan>
        <tspan fill="#94A3B8"> {</tspan>
      </text>

      <text x="722" y="114" fill="#7DD3FC">handle<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="114"><tspan fill="#86EFAC">"@thirza-rep"</tspan><tspan fill="#64748B">,</tspan></text>

      <text x="722" y="136" fill="#7DD3FC">org<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="136"><tspan fill="#86EFAC">"Codevits · Founder &amp; Author"</tspan><tspan fill="#64748B">,</tspan></text>

      <text x="722" y="158" fill="#7DD3FC">web<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="158"><tspan fill="#94A3B8">[</tspan><tspan fill="#FDE68A">"TS"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Vue 3"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"React"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Laravel 12"</tspan><tspan fill="#94A3B8">]</tspan><tspan fill="#64748B">,</tspan></text>

      <text x="722" y="180" fill="#7DD3FC">apps<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="180"><tspan fill="#94A3B8">[</tspan><tspan fill="#FDE68A">"Node.js"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Flutter"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Capacitor"</tspan><tspan fill="#94A3B8">]</tspan><tspan fill="#64748B">,</tspan></text>

      <text x="722" y="202" fill="#7DD3FC">data<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="202"><tspan fill="#94A3B8">[</tspan><tspan fill="#FDE68A">"PostgreSQL"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Supabase"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"MySQL"</tspan><tspan fill="#94A3B8">]</tspan><tspan fill="#64748B">,</tspan></text>

      <text x="722" y="224" fill="#7DD3FC">infra<tspan fill="#94A3B8">:</tspan></text>
      <text x="782" y="224"><tspan fill="#94A3B8">[</tspan><tspan fill="#FDE68A">"Docker"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Nginx"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#FDE68A">"Cloudflare"</tspan><tspan fill="#94A3B8">]</tspan></text>

      <text x="706" y="246" fill="#94A3B8">};</text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="16" stroke="#1E293B" stroke-width="1.5" />
</svg>
